version: '2'

tasks:
  async-stage:
    include:      
      - dind
    # async-stage includes one configurable step: run-stage
    steps:
      - name: run-stage
        onError: stopAndFail
        include:
          - docker-socket
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260625182010         
      - name: deploy-subpipeline
        script: |
          #!/usr/bin/env bash          
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/uuc/ci-consolidated/merge
          ${PATH_TO_PIPELINE}/steps/deploy_subpipeline.sh
          
      - name: finish
        when: false 
        