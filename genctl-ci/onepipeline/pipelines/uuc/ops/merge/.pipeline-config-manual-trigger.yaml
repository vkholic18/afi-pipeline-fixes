version: '2'

# UUC Ops Merge Pipeline: Team Onboarding Automation
# This pipeline runs when PRs are merged to provision infrastructure and create repositories

tasks:
  devmode-code-build:
    include:      
      - dind
      - step-extension
    displayName: Manual Onboarding
    steps:
      - name: setup
        when: 'false'        
      - name: unit-test
        when: 'false'      
      - name: build-artifact
        when: 'false'
      - name: step-extension
        displayName: manual-onboarding        
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/uuc/ops/merge

          # Export all required env properties
          export PIPELINE_MODE=$(get_env "PIPELINE_MODE")
          export PROCESS_ALL_FILES=$(get_env "PROCESS_ALL_FILES")
          export ONBOARDING_FILES=$(get_env "ONBOARDING_FILES")
          export ONBOARDING_BRANCH=$(get_env "ONBOARDING_BRANCH")
          export ACCOUNT_TYPE=$(get_env "ACCOUNT_TYPE")
          ${PATH_TO_PIPELINE}/steps/run_manual_onboarding_step.sh

  devmode-deploy-checks:
    when: 'false'

  devmode-deploy-release:
    when: 'false'

finally:
  code-ci-finish:
    steps:
      - name: run-stage
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        script: |
          #!/usr/bin/env bash
          
          if [[ "$PIPELINE_DEBUG" == 1 ]]; then
            trap env EXIT
            env
            set -x
          fi
          
          echo "╔════════════════════════════════════════════════════════════════════════════╗"
          echo "║                                                                            ║"
          echo "║  UUC Ops Manual Pipeline Finished                                          ║"
          echo "║                                                                            ║"
          echo "╚════════════════════════════════════════════════════════════════════════════╝"
          
          exit 0

# Made with Bob
