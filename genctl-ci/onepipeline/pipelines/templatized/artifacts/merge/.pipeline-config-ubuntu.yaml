version: '1'

setup:
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  dind: true
  script: |
    #!/usr/bin/env bash
    
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/merge
    ${PATH_TO_PIPELINE}/steps/setup.sh
test:
  # Here we use abort_on_failure: true since if we don't manage to properly build, we don't want to reach later stages
  # Since is a merge pipeline, we don't need to worry about GHE statuses
  # We can make a hard stop and avoid reaching later stages and doing logic to understand what happened in previous stages
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/merge
    ${PATH_TO_PIPELINE}/steps/test.sh
static-scan:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  dind: true
  abort_on_failure: false
  image_pull_policy: IfNotPresent
  skip: false
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/merge
    ${PATH_TO_PIPELINE}/steps/code-static-scan.sh
compliance-checks:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/bin/sh
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/merge
    ${PATH_TO_PIPELINE}/steps/compliance-checks.sh
sign-artifact:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    echo "Skipping"
    exit 0
containerize:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    echo "Skipping"
    exit 0
scan-artifact:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash
    echo "Skipping"
    exit 0
release:
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa-ubuntu:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    echo "Here we should have promotion and inventory add"
    exit 0