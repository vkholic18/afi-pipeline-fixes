version: '1'

setup:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash
    set -x
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/pr
    ${PATH_TO_PIPELINE}/steps/setup.sh
test:
  abort_on_failure: false
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/pr
    ${PATH_TO_PIPELINE}/steps/test.sh
compliance-checks:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: false
  image_pull_policy: IfNotPresent
  script: |
    #!/bin/sh
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/artifacts/pr
    ${PATH_TO_PIPELINE}/steps/compliance-checks.sh
