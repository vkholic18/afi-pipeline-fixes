version: '2'

tasks:
  pr-code-checks:
    include:
      - dind
    displayName: 01-detect-secrets
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail        
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          ADD_BRANCH_PROTECTION_RULES="$(get_env add-branch-protection-rules)"
          if [ "${ADD_BRANCH_PROTECTION_RULES}" = "1" ]; then
            echo "Applying branch protection rules to ${BASE_BRANCH}"
            ${COMMONS_PATH}/utils/setup_branch-protection.sh
          elif [ "${ADD_BRANCH_PROTECTION_RULES}" = "0" ]; then
            echo "Application of branch protection rules disabled"
          else
            echo "Invalid value present in env var add-branch-protection-rules, either 0 or 1"
            exit 1
          fi
      - name: detect-secrets
        onError: stopAndFail
        include:
          - docker-socket
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-2:
    include:
      - dind
    displayName: 02-unit-tests
    from: pr-code-checks
    steps:
      - name: checks-setup
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          ${PATH_TO_PIPELINE}/steps/test.sh
      - name: compliance-checks
        when: 'false'

  pr-code-checks-3:
    include:
      - dind
    runAfter:
      - pr-code-checks
    displayName: 03-build-amd64-images
    from: pr-code-checks
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash          
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          export BUILD_ARTIFACT_TYPE="images"
          ${PATH_TO_PIPELINE}/steps/build_amd64_artifacts.sh "BUILD_AMD64_IMAGES"
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: continue
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          ${PATH_TO_PIPELINE}/steps/compliance-checks.sh

  pr-code-checks-4:
    include:
      - dind
    displayName: 04-build-amd64-packages
    from: pr-code-checks
    runAfter:
      - pr-code-checks 
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          export BUILD_ARTIFACT_TYPE="packages"
          ${PATH_TO_PIPELINE}/steps/build_amd64_artifacts.sh "BUILD_AMD64_PACKAGES"
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-5:
    include:
      - dind
    displayName: 05-build-s390x-images
    from: pr-code-checks
    runAfter:
      - pr-code-checks 
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          export BUILD_ARTIFACT_TYPE="images"
          ${PATH_TO_PIPELINE}/steps/build_s390x_images.sh "onepipeline/pipelines/templatized/razee/hotfix-pr-v11/.pipeline-config-subpipeline-s390x-artifacts.yaml"
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-6:
    include:
      - dind
    displayName: 06-build-s390x-packages
    from: pr-code-checks
    runAfter:
      - pr-code-checks
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          export BUILD_ARTIFACT_TYPE="packages"
          ${PATH_TO_PIPELINE}/steps/build_s390x_packages.sh "onepipeline/pipelines/templatized/razee/hotfix-pr-v11/.pipeline-config-subpipeline-s390x-artifacts.yaml"
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-7:
    include:
      - dind
    displayName: 07-create-manifest
    runAfter:
      - pr-code-checks-3  #build-amd64-images
      - pr-code-checks-5  #build-s390x-images
    from: pr-code-checks
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/hotfix-pr-v11
          ${PATH_TO_PIPELINE}/steps/manifest.sh
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'

finally:  
  code-pr-finish:
    steps:
      - name: run-stage
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3.54
        script: |
          #!/usr/bin/env bash

          if [[ "$PIPELINE_DEBUG" == 1 ]]; then
            trap env EXIT
            env
            set -x
          fi
          echo "Running code-pr-finish"
          exit 0
