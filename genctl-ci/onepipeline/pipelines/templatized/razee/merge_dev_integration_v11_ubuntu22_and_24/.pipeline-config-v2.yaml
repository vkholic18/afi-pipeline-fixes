version: '2'

# CI Pipeline: code-checks, code-build, deploy-checks, deploy-release
tasks:
  code-checks:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    displayName: 01-auto-semver
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        script: |
          #!/usr/bin/env bash

          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/merge_dev_integration_v11_ubuntu22_and_24                    
          ${PATH_TO_PIPELINE}/steps/auto_semver.sh

      - name: detect-secrets
        include:
          - docker-socket
        onError: stopAndFail

      - name: compliance-checks
        when: 'false'
      
      - name: static-scan
        when: 'false'

  code-checks-2:
    include:
      - dind
    from: code-checks
    displayName: 02-unit-tests
    steps:      
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        include:
          - docker-socket
        onError: stopAndFail
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/merge_dev_integration_v11_ubuntu22_and_24
          ${PATH_TO_PIPELINE}/steps/unit-tests.sh

      - name: detect-secrets
        when: 'false'

      - name: compliance-checks
        when: 'false'

      - name: peer-review
        when: 'false'

      - name: static-scan
        when: 'false'

  code-checks-3:
    include:
      - dind
    from: code-checks
    displayName: 03-static-scan
    steps:      
      - name: checks-setup
        when: 'false'
 
      - name: detect-secrets
        when: 'false'

      - name: compliance-checks
        when: 'false'
      
      - name: peer-review
        when: 'false'
      
      - name: static-scan
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: continue
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/merge_dev_integration_v11_ubuntu22_and_24
          ${PATH_TO_PIPELINE}/steps/code-static-scan.sh

  code-checks-4:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    from: code-checks
    displayName: 04-build-amd64-images-ubuntu22
    runAfter:
      - code-checks #autosemver-task-1
      - code-checks-2 #unit-tests-task-2
    steps:      
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        when: 'false'
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash

          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/merge_dev_integration_v11_ubuntu22_and_24          
          export BUILD_ARTIFACT_TYPE="images"
          export BASE_IMAGE_VERSION="ubuntu22"
          ${PATH_TO_PIPELINE}/steps/build_amd64_artifacts.sh "BUILD_AMD64_IMAGES_UBUNTU22"

      - name: compliance-checks
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        when: 'false'
        include:
          - docker-socket
        onError: stopAndFail
        script: |
          #!/bin/sh
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/merge_dev_integration_v11_ubuntu22_and_24
          export BASE_IMAGE_VERSION="ubuntu22"
          ${PATH_TO_PIPELINE}/steps/compliance-checks.sh
      
      - name: detect-secrets
        when: 'false'
      
      - name: peer-review
        when: 'false'
      
      - name: static-scan
        when: 'false'
  
