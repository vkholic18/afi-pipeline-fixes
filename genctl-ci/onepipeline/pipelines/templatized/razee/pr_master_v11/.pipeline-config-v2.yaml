version: '2'

tasks:
  pr-code-checks:
    include:
      - dind
    displayName: 01-detect-secrets
    steps:
      - name: checks-setup
        when: 'false'    
      - name: detect-secrets
        include:
          - docker-socket  
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'

  pr-code-checks-2:
    include:
      - dind
    displayName: 02-misc-scans
    from: pr-code-checks
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail        
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master_v11
          ${PATH_TO_PIPELINE}/steps/misc-scans.sh
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-3:
    include:
      - dind
    displayName: 03-BRTs-and-Dynamic-Scan
    from: pr-code-checks
    runAfter:
      - pr-code-checks
      - pr-code-checks-2
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master_v11
          ${PATH_TO_PIPELINE}/steps/setup.sh
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master_v11
          ${PATH_TO_PIPELINE}/steps/test.sh
      - name: compliance-checks
        when: 'false'
  
  pr-code-checks-4:
    include:
      - dind
    runAfter:
      - pr-code-checks
      - pr-code-checks-2
    displayName: 04-code-compliance-checks
    from: pr-code-checks
    steps:
      - name: checks-setup
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: compliance-checks
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533        
        onError: stopAndFail
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master_v11
          ${PATH_TO_PIPELINE}/steps/compliance-checks.sh

finally:  
  code-pr-finish:
    steps:
      - name: run-stage
        onError: stopAndFail
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master_v11
          ${PATH_TO_PIPELINE}/steps/finish.sh          
          (
            set +e
            trap 'echo "WARNING: Log upload to COS encountered an error. Skipping."; exit 0' ERR
            source ${PATH_TO_GENCTL_CI}/scripts/log_analysis/log_utils.sh || { echo "WARNING: Failed to source log_utils.sh. Skipping log upload."; exit 0; }
            download_pipeline_logs
          ) || true
