version: '1'

setup:
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  script: |
    #!/usr/bin/env bash
    
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/setup.sh

test:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/test.sh
brt-as-subpipeline:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/brt_as_subpipeline.sh
# This is used only for specific workspaces that are configured through the following flag
# run-brt-and-ngdc-in-pr-to-master: true
deploy-ngdc-as-subpipeline:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/deploy_ngdc_as_subpipeline.sh
dynamic-scan-as-subpipeline:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: false
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/dynamic_scan_as_subpipeline.sh

# NOTE: Here we implement our own compliance-checks stage
# We consume OnePipeline compliance checks logic and in addition, if it passes, we do auto-merge to master
compliance-checks:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: false
  # We do abort_on_failure: false since no matter what happens in this stage, we want to move forward to code-pr-finish
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/compliance-checks.sh

finish:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: stopAndFail
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/razee/pr_master
    ${PATH_TO_PIPELINE}/steps/finish.sh