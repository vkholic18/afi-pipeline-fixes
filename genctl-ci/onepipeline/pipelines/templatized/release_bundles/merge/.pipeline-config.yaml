version: '1'

setup:
  dind: true
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash
    
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/setup.sh
test:
  # Here we use abort_on_failure: true since if we don't manage to properly build, we don't want to reach later stages
  # Since is a merge pipeline, we don't need to worry about GHE statuses
  # We can make a hard stop and avoid reaching later stages and doing logic to understand what happened in previous stages
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/test.sh
static-scan:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: false
  image_pull_policy: IfNotPresent
  skip: false
  script: |
    #!/bin/sh
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/code-static-scan.sh
compliance-checks:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/bin/sh
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/compliance-checks.sh
sign-artifact:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/sign_artifact.sh
sign-artifact-as-subpipeline:
  image: icr.io/continuous-delivery/toolchains/devsecops/csso-image-sign@sha256:2ffeac42170986cb4c14af776a365cb4a695c4d26e8dafdc1374148b74d982dd
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/sign_artifact_as_subpipeline.sh
containerize:
  abort_on_failure: true
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  script: |
    #!/usr/bin/env bash
    echo "skip containerize"
    exit 0
# We run scripts/ICCR.sh and push images to icr in scan-artifact for workaround to save icr artifacts after sign-artifact
# this issue shuld fix it: https://github.ibm.com/one-pipeline/adoption-issues/issues/1272
# it is preferable to push to icr in early stage to provide sufficient time for image to be scanned
scan-artifact:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  abort_on_failure: true
  image_pull_policy: IfNotPresent
  script: |
    #!/bin/sh
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/scan_artifact.sh
release:
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
  dind: true
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/release_bundles/merge
    ${PATH_TO_PIPELINE}/steps/release.sh
