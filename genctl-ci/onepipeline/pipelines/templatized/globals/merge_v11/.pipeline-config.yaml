version: '2'

# CI Pipeline: code-checks, code-build, deploy-checks, deploy-release
tasks:
  code-checks:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    displayName: 01-detect-secrets
    steps:
      - name: checks-setup
        when: 'false'

      - name: detect-secrets
        include:
          - docker-socket
        onError: stopAndFail
      
      - name: compliance-checks
        when: 'false'
      
      - name: static-scan
        when: 'false'
      
      - name: peer-review
        when: 'false'

  code-checks-2:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    displayName: 02-auto-semver-and-upload-files
    runAfter:
      - code-checks
    from: code-checks
    steps:
      - name: checks-setup
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        script: |
          #!/usr/bin/env bash

          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/globals/merge_v11
          ${PATH_TO_PIPELINE}/steps/setup.sh

      - name: detect-secrets
        when: 'false'
      
      - name: compliance-checks
        when: 'false'
      
      - name: static-scan
        when: 'false'
  
  code-checks-3:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    displayName: 03-static-scan
    runAfter:
      - code-checks
    from: code-checks
    steps:
      - name: checks-setup
        when: 'false'

      - name: detect-secrets
        when: 'false'
      
      - name: peer-review        
        when: 'false'
      
      - name: compliance-checks
        when: 'false'      
      
      - name: static-scan
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: continue
        include:
          - docker-socket
        script: |
          #!/bin/sh
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/globals/merge_v11
          ${PATH_TO_PIPELINE}/steps/code-static-scan.sh

  code-checks-4:
    include:
      - dind
    # code-checks includes five configurable steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
    from: code-checks
    displayName: 04-compliance-checks
    runAfter:
      - code-checks
    steps:      
      - name: checks-setup
        when: 'false'
      - name: compliance-checks
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        include:
          - docker-socket
        onError: stopAndFail
        script: |
          #!/bin/sh
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/globals/merge_v11
          ${PATH_TO_PIPELINE}/steps/compliance-checks.sh
      
      - name: detect-secrets        
        when: 'false'          
      
      - name: peer-review        
        when: 'false'
      
      - name: static-scan        
        when: 'false'
  
  code-build:
    include:
      - dind    
    displayName: 05-unit-tests
    # code-build includes five configurable steps: setup, unit-test, build-artifact, sign-artifact, scan-artifact
    steps:
      - name: setup
        when: 'false'
      - name: unit-test
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'

  deploy-checks:
    include:
      - dind
    runAfter:
      - code-build
    displayName: 06-deploy-checks
    # deploy-checks includes three configurable steps: deploy, dynamic-scan, acceptance-test
    steps:
      - name: deploy
        when: 'false'

      - name: dynamic-scan
        when: 'false'

      - name: acceptance-test
        when: 'false'

  deploy-release:
    include:
      - dind
    runAfter:
      - deploy-checks
    displayName: 07-deploy-release
    # deploy-release includes one configurable step: run-stage
    steps:
      - name: run-stage
        onError: stopAndFail
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/templatized/globals/merge_v11
          ${PATH_TO_PIPELINE}/steps/release.sh

finally:
  code-ci-finish:
    steps:
      - name: run-stage
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        script: |
          #!/usr/bin/env bash

          if [[ "$PIPELINE_DEBUG" == 1 ]]; then
            trap env EXIT
            env
            set -x
          fi
          echo "Running code-ci-finish"
          exit 0
