version: '2'

tasks:
  pr-code-checks:
    include:
    - dind
    displayName: build-amd64
    steps:
    - name: checks-setup
      when: 'false'
    - name: detect-secrets
      include:
      - docker-socket
    - name: unit-test
      onError: stopAndFail
      image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533-amd64
      include:
      - docker-socket
      script: |
        #!/usr/bin/env bash
        export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
        export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cocoa_image_pr_v11
        export BUILD_ARTIFACT_TYPE="images"
        # run the test
        ${PATH_TO_PIPELINE}/steps/test.sh
    - name: compliance-checks
      include:
      - docker-socket
      image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533-amd64
      onError: stopAndFail
      script: |
        #!/bin/sh
        export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
        export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cocoa_image_pr_v11
        ${PATH_TO_PIPELINE}/steps/compliance-checks.sh

  pr-code-checks-2:
    include:
    - dind
    from: pr-code-checks
    displayName: build-s390x
    steps:
    - name: checks-setup
      when: 'false'
    - name: detect-secrets
      when: 'false'
    - name: unit-test
      onError: stopAndFail
      image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
      include:
      - docker-socket
      script: |
        #!/usr/bin/env bash 
        set -x          
        export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
        export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cocoa_image_pr_v11
        export BUILD_ARTIFACT_TYPE="images"
        # run the test
        ${PATH_TO_PIPELINE}/steps/build_s390x_images.sh
    - name: compliance-checks
      when: 'false'

  pr-code-checks-3:
    include:
    - dind
    from: pr-code-checks
    displayName: create-manifest
    runAfter:
    - pr-code-checks
    - pr-code-checks-2
    steps:
    - name: checks-setup
      when: 'false'
    - name: detect-secrets
      when: 'false'
    - name: unit-test
      onError: stopAndFail
      image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
      include:
      - docker-socket
      script: |
        #!/usr/bin/env bash    
        set -x       
        export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
        export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cocoa_image_pr_v11
        export CREATE_MANIFEST="true"
        # run the test
        ${PATH_TO_PIPELINE}/steps/test.sh
    - name: compliance-checks
      when: 'false'

finally:
  code-pr-finish:
    steps:
    - name: run-stage
      image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3.54
      script: |
        #!/usr/bin/env bash

        if [[ "$PIPELINE_DEBUG" == 1 ]]; then
          trap env EXIT
          env
          set -x
        fi
        echo "Running code-pr-finish"
        exit 0
