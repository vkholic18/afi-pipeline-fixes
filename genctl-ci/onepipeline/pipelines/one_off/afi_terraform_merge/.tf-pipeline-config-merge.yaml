version: '2'

# AFI Terraform Merge Pipeline - simple-execute listener
tasks:
  simple-execute:
    steps:
      - name: execute
        image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-ci:22.20260817071533
        onError: stopAndFail
        script: |
          #!/usr/bin/env bash
          export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
          export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/afi_terraform_merge
          chmod +x ${PATH_TO_PIPELINE}/steps/setup.sh
          ${PATH_TO_PIPELINE}/steps/setup.sh
          chmod +x ${PATH_TO_PIPELINE}/steps/test.sh
          ${PATH_TO_PIPELINE}/steps/test.sh
