version: '1'

setup:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cion_resourcelock_release
    ${PATH_TO_PIPELINE}/steps/setup.sh

test:
  dind: true
  abort_on_failure: false
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  script: |
    #!/usr/bin/env bash
    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/one_off/cion_resourcelock_release
    # run the test
    ${PATH_TO_PIPELINE}/steps/test.sh
    
detect-secrets:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  image_pull_policy: IfNotPresent
  abort_on_failure: false
  dind: true           
  script: |
    #!/bin/sh
    
    echo "Skip detect secrets"

compliance-checks:
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  dind: true
  abort_on_failure: false
  image_pull_policy: IfNotPresent
  script: |
    #!/bin/sh

    echo "Skip compliance checks"
