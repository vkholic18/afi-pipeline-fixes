version: '1'

setup:
  abort_on_failure: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/cd/templatized/release_bundle_deploy/pr_master
    ${PATH_TO_PIPELINE}/steps/setup.sh
test:
  abort_on_failure: false
  dind: true
  image: us.icr.io/genctl-cicd-onepipeline/genctl/golang-cocoa:20250204015122-amd64
  script: |
    #!/usr/bin/env bash

    export PATH_TO_GENCTL_CI="${WORKSPACE}/one-pipeline-config-repo"
    export PATH_TO_PIPELINE=${PATH_TO_GENCTL_CI}/onepipeline/pipelines/cd/templatized/release_bundle_deploy/pr_master
    ${PATH_TO_PIPELINE}/steps/test.sh
