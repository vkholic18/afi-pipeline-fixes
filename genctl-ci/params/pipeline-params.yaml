# The default behaviouRIAS_GLOBALS is running the conventional commit enforcement
# Pipelines that want to skip it should override to true
skip-conventional-commit-enforcement: false

#The default behavior is having auto-merge (For relevant templates)
# Pipelines that run with these templates and do not want to enforce it should override to true
skip-auto-merge: false

# Default behaviour is skipping check pr title (Only for templates that have the SKIP_CHECK_PR_TITLE )
# Pipelines that run with template that has SKIP_CHECK_PR_TITLE but do not want to skip, should override with false
skip-check-pr-title: true

# Default behaviour for artifacts is to run check PR title
# If some repo uses artifacts template and does not want to run the check, should override with true
skip-check-pr-title-artifacts: false

# Default behaviour should be checking that pr to master comes from dev-integration
# Pipelines that do not want this check need to override with true
skip-check-pr-to-master-is-from-dev-int: false

# Default behaviour should be not to use partial match for the verify-pr-head logic
# Pipelines that want the partial match should override with true
verify-pr-head-partial-match: false

# By default the validate-global-keys is skiped
# Pipelines that want to enforce it should override to false
skip-validate-global-keys: true

skip-validate-remote-resource: false

# By default the update release version runs
# Pipelines that want to skip it should override to true
skip-update-release-version: false
skip-label-validation: false

# By default we do want to run validate razee cluster
# If a workspace does NOT need to run validate razee cluster, then should be override to true
skip-validate-razee-cluster: false

# By default the update hostos runs
# Pipelines that want to enforce it being skipped, then should override to true
skip-update-hostos: false

# By default the secret label validation is skipped
# Pipelines that want to enforce it being run, then should override to false
skip-secret-label-validation: true

# By default, we should verify the workspace-dependencies file
# Pipelines that do not want this check need to override with true
skip-verify-workspace-dependencies-file: false

# By default VA scans run as part of the scan-artifact step
# Pipelines that want to skip VA scans should override to true
skip-va-scan: true

# This param used by the new PR resource to decide if trigger the pipeline only in case a label is set
# By default PRs triggered without label (empty parameter). In order to override it, set the value of the label within the override param file
# For example: scan-label: "concourse"
scan-label:

