###############################################
# Override File Format
#
# To override a single, templated, pipeline with one or more values:
# * Create an additional entry following the given format *
#  #<template-name>
#  - name: <pipeline-name>
#      overrides:
#        <overrides to add>
#
# All values in this file will be merged with pipeline-params.yaml and the
# resultant merged file will be used as the final pipeline meta file when automation performs a set-pipeline command.
###############################################
