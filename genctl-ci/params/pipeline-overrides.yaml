      package: genctl-release
      inventory-org-specific-for_debian: cloudnet
      inventory-repo_specific-for_debian: sdn-inventory
      skip-move-packages-from-vetted-to-final-destination: true
      lock-pool: "release-deploy-lock-sdn"
      check-if-need-to-run-semver: true
      apply-dmm-deploy-process: true
      use-qz2-worker: true

  - name: kali-dev-integration-pr
    overrides:
      skip-conventional-commit-enforcement: true
      skip-validate-global-keys: false
      upload-to-registry-flag: true
      skip-upload-packages-on-pr-pipeline: true

  - name: kali-pr
