  - name: acadia-storage-workspace-merge
    overrides:
      run-brt-stat-exporter: false
      upload-to-registry-flag: false
      timeout-min: 120m

  - name: acadia-storage-workspace-dev-integration-merge
    overrides:
      upload-to-registry-flag: true
      upload-to-cos-python-issue-workaround: true

  - name: acadia-storage-workspace-pr
    overrides:
      upload-to-registry-flag: false

  - name: acadia-storage-workspace-dev-integration-pr
    overrides:
      upload-to-registry-flag: true
      skip-code-static-scan: false
      upload-to-cos-python-issue-workaround: true
  
  - name: acadia-storage-workspace-travis-migration-v11-pr
    overrides:
      upload-to-registry-flag: true
      skip-code-static-scan: false
      upload-to-cos-python-issue-workaround: true
  
  - name: acadia-storage-workspace-travis-migration-v11-merge
    overrides:
      upload-to-registry-flag: true
      upload-to-cos-python-issue-workaround: true

